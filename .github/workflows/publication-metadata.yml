name: English Manga Publication Metadata Audit

on:
  push:
    branches: [feature/metadata-coverage-review-20261120]
    paths:
      - manga_retriever/publication_metadata.py
      - tests/test_publication_metadata.py
      - scripts/package_publication_metadata.py
      - tests/test_publication_metadata_bundle.py
      - .github/workflows/publication-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata and cover reference - ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slug: [relife, maid-sama, last-game, love-so-life, onizuka-sawarida, kainushi-wa-akuma, kimi-no-iru-machi, love-hina, lovely-complex, mado-kara-madoka-chan, nisekoi]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install metadata-only package
        run: python -m pip install -e .
      - name: Check metadata schema, source identity and no artwork retrieval
        run: python -m unittest tests.test_publication_metadata -v
      - name: Fetch source-authorised public metadata only (no image bytes)
        env:
          MANGA_SLUG: ${{ matrix.slug }}
        run: |
          python -m manga_retriever.publication_metadata \
            --slug "$MANGA_SLUG" \
            --output "metadata-candidates/$MANGA_SLUG.json"
      - name: Upload provenance-labelled draft for Controller review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-review-${{ matrix.slug }}
          path: metadata-candidates/${{ matrix.slug }}.json
          retention-days: 7
          if-no-files-found: warn

  package-review:
    name: Bundle all 11 publication metadata candidates for Controller
    needs: [metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: python -m pip install -e .
      - name: Download all 11 metadata-only JSON records from this run
        uses: actions/download-artifact@v7
        with:
          pattern: metadata-review-*
          path: metadata-candidates/
          merge-multiple: true
      - name: Verify all source IDs and produce one review-only ZIP
        run: |
          python -m unittest tests.test_publication_metadata_bundle -v
          python -m scripts.package_publication_metadata \
            --source metadata-candidates \
            --output review/manga-publication-metadata.zip
      - name: Publish combined metadata report (no images)
        uses: actions/upload-artifact@v7
        with:
          name: manga-publication-metadata-11-review
          path: review/manga-publication-metadata.zip
          retention-days: 7
          if-no-files-found: error
