name: Licensed English Image, ZIP and EPUB Download Pilot

on:
  push:
    branches: [feature/english-image-zip-epub-actions-20261120]
    paths:
      - .github/workflows/english-alternative-formats.yml
      - manga_retriever/alternative_formats.py
      - tests/test_alternative_formats.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licensed-english-alternatives-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-and-package:
    name: Download verified English images and publish three formats
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -e .
      - name: Verify packaging with offline English images and damage checks
        run: python -m unittest tests.test_alternative_formats -v
      - name: Download six high-resolution English creator-licensed pages
        run: |
          python -m manga_retriever peppercarrot --episode 26 \
            --output downloaded/peppercarrot-en-26 \
            --registry .manga-retriever/ids.json
      - name: Independently verify original pages, rights and CBZ media
        run: python -m manga_retriever verify --export downloaded/peppercarrot-en-26
      - name: Package original JPEG ZIP and reader-ready EPUB
        run: |
          python -m manga_retriever.alternative_formats \
            --export downloaded/peppercarrot-en-26 \
            --output deliverables/peppercarrot-en-26
          cp downloaded/peppercarrot-en-26/chapters/*.cbz \
             deliverables/peppercarrot-en-26/English-PepperCarrot-Episode26.cbz
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("deliverables/peppercarrot-en-26/verification.json").read_text())
          assert report["status"] == "verified-media", report
          assert report["language"] == "en" and report["pages"] == 6, report
          for name in ("english-original-images.zip", "english-fixed-layout.epub",
                       "English-PepperCarrot-Episode26.cbz"):
              assert (Path("deliverables/peppercarrot-en-26") / name).is_file(), name
          print("Verified source pages: 6; original-image ZIP, EPUB and CBZ are present.")
          PY
      - name: Publish real licensed media, not chapter-list metadata
        uses: actions/upload-artifact@v7
        with:
          name: licensed-english-ZIP-EPUB-CBZ-${{ github.run_id }}
          path: deliverables/peppercarrot-en-26/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
