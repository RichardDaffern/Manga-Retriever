name: Additional Manga Batch Recovery

on:
  workflow_run:
    workflows:
      - Love So Life English Original-Quality Download
      - Kainushi wa Akuma Available English Batches
    types: [completed]

permissions:
  contents: read

jobs:
  retry-failed:
    name: Retry failed manga batch jobs automatically up to three attempts
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Allow transient source conditions to settle
        run: sleep 60
      - name: Re-run failed jobs only and preserve successful artefacts
        shell: bash
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid source workflow run ID' >&2
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/rerun-failed-jobs"
