name: New Target MangaDex Metadata Audit

on:
  push:
    branches: [feature/new-target-mangadex-metadata-audit-20261122]
    paths:
      - scripts/new_target_mangadex_audit.py
      - tests/test_new_target_mangadex_audit.py
      - .github/workflows/new-target-mangadex-metadata-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Run offline safeguards
        run: python -m unittest tests.test_new_target_mangadex_audit -v
      - name: Query exact titles, English feeds and one page manifest per title
        run: python -m scripts.new_target_mangadex_audit --output reports/new-target-mangadex-metadata.json
      - name: Publish metadata-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: new-target-mangadex-metadata-only
          path: reports/new-target-mangadex-metadata.json
          retention-days: 7
          if-no-files-found: warn
