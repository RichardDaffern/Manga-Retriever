name: Manga Ephemeral Image Quality Comparison

on:
  push:
    branches:
      - feature/love-kainushi-ephemeral-image-quality-20261120
    paths:
      - scripts/love_kainushi_quality.py
      - tests/test_love_kainushi_quality.py
      - .github/workflows/love-kainushi-image-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-original-vs-saver:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pillow and project verifier
        run: python -m pip install -e .
      - name: Synthetic validation of source URL safety and image limits
        run: python -m unittest tests.test_love_kainushi_quality -v
      - name: Sample two chapters per title, one page each in original and data-saver mode
        run: python -m scripts.love_kainushi_quality --output reports/love-kainushi-image-quality.json
      - name: Upload metrics only (no copyright page images)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: love-kainushi-image-quality-metrics-only
          path: reports/love-kainushi-image-quality.json
          if-no-files-found: warn
          retention-days: 7
