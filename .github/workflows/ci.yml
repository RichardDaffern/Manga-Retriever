name: CI and Security Verification
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[pdf]'
      - name: Synthetic unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile all Python modules
        run: python -m compileall -q manga_retriever tests
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev,pdf]'
      - name: Static lint
        run: python -m ruff check manga_retriever tests
      - name: Dependency audit
        run: python -m pip_audit

  controller-candidate-contract:
    # Public, token-free synthetic test against an immutable Controller commit.
    # This is candidate acceptance only, never a private dataset write.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Retriever and pinned Controller
        run: |
          python -m pip install -e .
          python -m pip install "git+https://github.com/AdityaSreevatsaK/Taiyou-Manga-Storage-Controller.git@f6bfc82b335c415dac55512c4dc4d640a5883392"
      - name: Verify a synthetic Retriever export with the real Controller
        run: python -m unittest tests.test_controller_acceptance -v

  licensed-source-smoke:
    # This one-off M3 PR gate contacts only the officially licensed Episode 26.
    # No media artefact is uploaded or retained after the job.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/m3-peppercarrot-licensed-episode' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Verify actual licensed episode download
        run: |
          python -m manga_retriever peppercarrot --episode 26 --output ./smoke-episode26 --registry ./.manga-retriever/ids.json
          python -m manga_retriever verify --export ./smoke-episode26

  batch-recovery-smoke:
    # Deterministic PR gate. External websites are not dependable CI fixtures.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/m5-allowlisted-bulk-registry' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package and Pillow dependency
        run: python -m pip install -e .
      - name: Exercise approved planning and offline registry tests
        run: |
          python -m manga_retriever.batch prepare --selection peppercarrot:26
          python -m unittest tests.test_batch -v
      - name: Verify incomplete batch is reported, not marked successful
        run: |
          mkdir -p receipts
          python -m manga_retriever.batch consolidate \
            --expected-json '[{"key":"peppercarrot:26","slug":"peppercarrot-26"}]' \
            --receipts receipts --registry downloaded_manga.json \
            --markdown DOWNLOADED_MANGA.md --status manga_batch_status.json
          python -c "import json; from pathlib import Path; assert json.loads(Path('manga_batch_status.json').read_text())['missing'] == ['peppercarrot:26']"
          if python -m manga_retriever.batch check-status --status manga_batch_status.json; then
            echo 'Incomplete batch incorrectly reported success' >&2
            exit 1
          fi
