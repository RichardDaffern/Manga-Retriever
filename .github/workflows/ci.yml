name: CI and Security Verification
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - name: Synthetic unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile all Python modules
        run: python -m compileall -q manga_retriever tests
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Static lint
        run: python -m ruff check manga_retriever tests
      - name: Dependency audit
        run: python -m pip_audit

  licensed-source-smoke:
    # This one-off M3 PR gate contacts only the officially licensed Episode 26.
    # No media artefact is uploaded or retained after the job.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/m3-peppercarrot-licensed-episode' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Verify actual licensed episode download
        run: |
          python -m manga_retriever peppercarrot --episode 26 --output ./smoke-episode26 --registry ./.manga-retriever/ids.json
          python -m manga_retriever verify --export ./smoke-episode26

  approved-batch-smoke:
    # Branch-scoped real test against already approved licensed Episode 26 only.
    # No content is published; the receipt URL is synthetic and test-local.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/m5-allowlisted-bulk-registry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Check strict planner and download the permitted episode
        run: |
          python -m manga_retriever.batch prepare --selection 'peppercarrot:26'
          python -m manga_retriever.batch download --key 'peppercarrot:26' \
            --output ./smoke-episode26 --ids .manga-retriever/ids.json
          python -m manga_retriever verify --export ./smoke-episode26
      - name: Verify receipt generation and lossless metadata reconciliation
        run: |
          python -m manga_retriever.batch receipt \
            --key 'peppercarrot:26' --export ./smoke-episode26 \
            --run-id 1234567 --artifact-id 98765 \
            --artifact-url https://github.com/RichardDaffern/Manga-Retriever/actions/runs/1234567/artifacts/98765 \
            --output receipts/record-peppercarrot-26.json
          python -m manga_retriever.batch consolidate \
            --expected-json '[{"key":"peppercarrot:26","slug":"peppercarrot-26"}]' \
            --receipts receipts --registry downloaded_manga.json \
            --markdown DOWNLOADED_MANGA.md --status manga_batch_status.json
          python -m manga_retriever.batch check-status --status manga_batch_status.json
