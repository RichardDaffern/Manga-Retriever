name: Kainushi wa Akuma Available English Batches

on:
  push:
    branches: [feature/love-so-life-kainushi-actions-20261120]
    paths:
      - .github/workflows/kainushi-available-download.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kainushi-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-partial-source-batches:
    name: Kainushi available English labels batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded English MangaDex downloader and image auditor
        run: |
          python -m pip install -e .
          python -m pip install 'mangadex-downloader==3.1.4'
      - name: Fetch only MangaDex-listed English labels, audit CBZ images and label gaps
        env:
          KAINUSHI_BATCH: ${{ matrix.batch }}
        run: |
          python -m scripts.kainushi_partial \
            --batch "$KAINUSHI_BATCH" \
            --output "downloads/kainushi-$KAINUSHI_BATCH" \
            --verified-output "verified/kainushi-$KAINUSHI_BATCH"
      - name: Publish validated partial batch and missing-label report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kainushi-Available-English-Batch${{ matrix.batch }}
          path: verified/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
