name: Three Manga Batch Recovery

on:
  workflow_run:
    workflows:
      - Three Manga English Original-Quality Downloads
      - Onizuka Manga Original-Quality Recovery Downloads
    types: [completed]

permissions:
  contents: read

jobs:
  automatic-retry:
    # Quarantined: do not publish or rerun historical public third-party media jobs.
    name: Retry only failed manga chapter batches, max 3 attempts
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Cooldown after transient MangaDex failures
        run: sleep 60
      - name: Preserve passed batches and rerun only failed jobs
        shell: bash
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid run ID' >&2
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/rerun-failed-jobs"
